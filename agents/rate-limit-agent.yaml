name: rate-limit-agent
description: "Platform engineer adding token-bucket rate limiting to auth middleware endpoints with Redis-backed sliding window counters."
executor:
  harness: openrouter
  model: gpt-4o
  auth: env:OPENROUTER_API_KEY
soul: plat
tools:
  - nool.query
  - nool.propose
  - nool.announce
  - fs.read
  - fs.write
budget:
  per_run_usd: 1.00
  max_turns: 35
  compaction_window: 180000
policy:
  blast_radius_max: 20
  on_overlap: lease
  trust_tier: 2
  role: developer
retry:
  max_retries: 2
  backoff_base_ms: 500
  jitter: false
